<!doctype html>
<html lang="zh-CN" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AI Life OS — 围绕你长期成长建立的 AI 内心支持系统：人格档案、内心圆桌、未来模拟与人格网络。"
    />
    <meta name="google" content="notranslate" />
    <title>AI Life OS — 你的第二大脑</title>
    <script>
      // SPA fallback for GitHub Pages: /portfolio/<path> 刷新时 404.html 会把路径
      // 作为 ?p= 参数重定向回首页，这里把它还原成真实路径再交给 React Router。
      (function () {
        var m = window.location.search.match(/[?&]p=([^&]+)/);
        if (m && m[1]) {
          var restored = "/" + decodeURIComponent(m[1]);
          history.replaceState(null, "", restored);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
